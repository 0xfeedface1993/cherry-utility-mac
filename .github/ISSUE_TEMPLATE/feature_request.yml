name: 功能建议
description: 想要的新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议的做法
  - type: textarea
    id: context
    attributes:
      label: 补充
      description: 键盘型号、官方 Windows 驱动里的对应功能、截图等。
