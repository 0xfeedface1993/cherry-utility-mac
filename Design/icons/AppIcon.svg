<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Body: deep cherry, lit from the top -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4F6D"/>
      <stop offset="0.45" stop-color="#D3123F"/>
      <stop offset="1" stop-color="#6E0A25"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Keycap -->
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9BCB6"/>
      <stop offset="1" stop-color="#8F817B"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE8E4"/>
      <stop offset="1" stop-color="#CFC3BD"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EDEA"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A5F55" stop-opacity="0.16"/>
    </radialGradient>
    <!-- Cherries -->
    <radialGradient id="cherryL" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FF6A84"/>
      <stop offset="0.55" stop-color="#E01845"/>
      <stop offset="1" stop-color="#8A0D2E"/>
    </radialGradient>
    <radialGradient id="cherryR" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FF5A76"/>
      <stop offset="0.55" stop-color="#C80F3B"/>
      <stop offset="1" stop-color="#6E0A25"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BD36A"/>
      <stop offset="1" stop-color="#2E8B3E"/>
    </linearGradient>
    <filter id="capShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A0716" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824×824 body centred on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGlow)"/>
    <!-- faint key grid in the background -->
    <g fill="#FFFFFF" opacity="0.05">
      <rect x="140" y="808" width="132" height="132" rx="26"/>
      <rect x="292" y="808" width="132" height="132" rx="26"/>
      <rect x="444" y="808" width="132" height="132" rx="26"/>
      <rect x="596" y="808" width="132" height="132" rx="26"/>
      <rect x="748" y="808" width="132" height="132" rx="26"/>
    </g>
    <!-- keycap contact shadow -->
    <ellipse cx="512" cy="760" rx="262" ry="44" fill="#2A0410" opacity="0.55" filter="url(#capShadow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" ry="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Keycap: skirt (sides), front wall, then the top face -->
  <path d="M 362 268 L 662 268 Q 712 268 720 318 L 772 690 Q 780 752 718 752 L 306 752 Q 244 752 252 690 L 304 318 Q 312 268 362 268 Z" fill="url(#skirt)"/>
  <path d="M 356 560 L 668 560 Q 704 560 712 596 L 744 700 Q 756 744 712 744 L 312 744 Q 268 744 280 700 L 312 596 Q 320 560 356 560 Z" fill="url(#front)"/>
  <rect x="318" y="246" width="388" height="372" rx="64" ry="64" fill="url(#top)"/>
  <rect x="318" y="246" width="388" height="372" rx="64" ry="64" fill="url(#dish)"/>
  <rect x="319.5" y="247.5" width="385" height="369" rx="62.5" ry="62.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"/>

  <!-- Cherry pair -->
  <g filter="url(#softShadow)">
    <path d="M 470 486 C 474 420 500 372 548 338" fill="none" stroke="#4E6B2A" stroke-width="13" stroke-linecap="round"/>
    <path d="M 566 498 C 566 440 560 388 548 338" fill="none" stroke="#4E6B2A" stroke-width="13" stroke-linecap="round"/>
    <path d="M 548 338 C 584 300 640 298 668 322 C 636 352 586 360 548 338 Z" fill="url(#leaf)"/>
    <path d="M 552 337 C 590 326 626 322 660 323" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <circle cx="462" cy="520" r="58" fill="url(#cherryL)"/>
    <circle cx="574" cy="532" r="56" fill="url(#cherryR)"/>
    <ellipse cx="442" cy="500" rx="15" ry="11" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 442 500)"/>
    <ellipse cx="555" cy="512" rx="14" ry="10" fill="#FFFFFF" opacity="0.7" transform="rotate(-30 555 512)"/>
  </g>
</svg>
