name: CherryUtility
options:
  bundleIdPrefix: online.odeployer
  deploymentTarget:
    macOS: "15.0"
  settingPresets: all
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  # All UI text is Chinese; without this the bundle reports "en", so Sparkle's dialogs and system date formats come out in English.
  developmentLanguage: zh-Hans
configs:
  Debug: debug
  Release: release
packages:
  CherryKit:
    path: Packages/CherryKit
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.26.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.8.0"
  # `cherry mcp` 的 MCP 服务（只给命令行用，App 不链接）。
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"
  # MCPTransport 直接引用 swift-sdk 传输协议里的 `Logger`；版本由 swift-sdk 决定。
  SwiftLog:
    url: https://github.com/apple/swift-log.git
    from: "1.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Only the app declares App Intents; skipping the extractor elsewhere avoids its "Metadata extraction skipped" warning.
    LM_SKIP_METADATA_EXTRACTION: "YES"
targets:
  CherryUtility:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: CherryKit
        product: CherryCore
      - package: CherryKit
        product: CherryAdapters
      - package: CherryKit
        product: CherryFeatures
      - package: CherryKit
        product: CherrySimulation
      - package: CherryKit
        product: CherryControl
      - package: CherryKit
        product: CherryControlService
      - package: ComposableArchitecture
      - package: Sparkle
        product: Sparkle
      # 命令行工具放在 Contents/MacOS/cherry，随 App 一起签名、公证和通过 Sparkle 更新。
      - target: cherry
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CHERRY Utility
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: 非官方工具，与 CHERRY 无关联。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: online.odeployer.cherry-utility.profile
            UTTypeDescription: CHERRY Utility 配置预设
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [cherryprofile]
            # macOS 11+ composes the document icon from the generic page plus this badge.
            UTTypeIcons:
              UTTypeIconBadgeName: DocumentBadge
              UTTypeIconText: cherryprofile
        # Sparkle: signed appcast on our site; the public key matches the private key kept outside the repo.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: App/CherryUtility.entitlements
      properties:
        # IOKit HID access to the keyboard's vendor/OTA interfaces is not available to sandboxed apps.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.odeployer.CherryUtility
        PRODUCT_NAME: CherryUtility
        # 快捷指令 / Spotlight 意图（App/Sources/Intents）：构建时提取 Metadata.appintents，系统据此发现动作。
        LM_SKIP_METADATA_EXTRACTION: "NO"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_FEED_URL: "https://odeployer.online/cherry-utility/appcast.xml"
        SPARKLE_PUBLIC_ED_KEY: "81JlZDXsML1zrxIKtUEebjNbE5HW41BhF2J3RiSH7q0="
        # Developer ID distribution needs the hardened runtime; IOKit HID needs no extra entitlement.
        ENABLE_HARDENED_RUNTIME[config=Debug]: NO
        ENABLE_HARDENED_RUNTIME[config=Release]: YES
        ARCHS[config=Release]: "arm64 x86_64"
        COMBINE_HIDPI_IMAGES: YES
  # `cherry` 命令行：源码与 CherryKit 的 CherryCLI 可执行 target 相同（那边用于 swift build / 测试），这里构建要嵌入 App 的版本。
  cherry:
    type: tool
    platform: macOS
    sources:
      - path: Packages/CherryKit/Sources/CherryCLI
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: CherryKit
        product: CherryControl
      - package: ArgumentParser
        product: ArgumentParser
      - package: MCPSwiftSDK
        product: MCP
      - package: SwiftLog
        product: Logging
    settings:
      base:
        PRODUCT_NAME: cherry
        PRODUCT_BUNDLE_IDENTIFIER: online.odeployer.CherryUtility.cli
        # 二进制内嵌 Info.plist，签名标识取 bundle ID。
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME[config=Debug]: NO
        ENABLE_HARDENED_RUNTIME[config=Release]: YES
        ARCHS[config=Release]: "arm64 x86_64"
  CherryUtilityUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes:
          - "Intents/**"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: CherryUtility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.odeployer.CherryUtility.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: UITests/CherryUtilityUITests.entitlements
        TEST_TARGET_NAME: CherryUtility
        ENABLE_HARDENED_RUNTIME: NO
  # 意图测试经系统 App Intents 服务执行（AppIntentsTesting，macOS 27+），单独成 target 以免抬高其它 UI 测试的系统要求。
  CherryUtilityIntentsUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: UITests/Intents
      - path: UITests/Support
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: CherryUtility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.odeployer.CherryUtility.intents-uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: UITests/CherryUtilityUITests.entitlements
        TEST_TARGET_NAME: CherryUtility
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "27.0"
schemes:
  CherryUtility:
    build:
      targets:
        CherryUtility: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # SwiftPM 静态库的覆盖率记录在测试 bundle 中，必须收集全部 target。
      targets:
        - package: CherryKit/CherryCoreTests
        - package: CherryKit/CherryAdaptersTests
        - package: CherryKit/CherryFeaturesTests
        - package: CherryKit/CherrySimulationTests
        - package: CherryKit/CherryControlTests
        - package: CherryKit/CherryControlServiceTests
        # CherryCLITests 依赖可执行目标 CherryCLI，Xcode 会顺带链接包里的 cherry，与上面的 cherry 工具 target 产物同名冲突；
        # 它只在 `swift test` 里运行。
        - CherryUtilityUITests
        - CherryUtilityIntentsUITests
    archive:
      config: Release
