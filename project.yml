name: CherryUtility
options:
  bundleIdPrefix: dev.local.cherry
  deploymentTarget:
    macOS: "15.0"
  settingPresets: all
  xcodeVersion: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  CherryKit:
    path: Packages/CherryKit
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CherryUtility:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: CherryKit
        product: CherryCore
      - package: CherryKit
        product: CherryAdapters
      - package: CherryKit
        product: CherryFeatures
      - package: ComposableArchitecture
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CHERRY Utility
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Unofficial macOS companion for CHERRY keyboards.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.local.cherry.utility.profile
            UTTypeDescription: CHERRY Utility 配置预设
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [cherryprofile]
    entitlements:
      path: App/CherryUtility.entitlements
      properties:
        # IOKit HID access to the keyboard's vendor/OTA interfaces is not available to sandboxed apps.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.cherry.utility
        PRODUCT_NAME: CherryUtility
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  CherryUtilityUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: CherryUtility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.cherry.utility.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CherryUtility
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  CherryUtility:
    build:
      targets:
        CherryUtility: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # SwiftPM 静态库的覆盖率记录在测试 bundle 中，必须收集全部 target。
      targets:
        - package: CherryKit/CherryCoreTests
        - package: CherryKit/CherryAdaptersTests
        - package: CherryKit/CherryFeaturesTests
        - CherryUtilityUITests
    archive:
      config: Release
